# Workers + D1 版 (workers/) の CI。
# 型チェック・テスト (実 D1/miniflare 結合を含む)・デプロイ dry-run を検証する。
# 本番デプロイはこのワークフローでは行わない (手動運用)。
name: workers-ci

on:
  push:
    paths:
      - "workers/**"
      - ".github/workflows/workers-ci.yml"
  pull_request:
    paths:
      - "workers/**"
      - ".github/workflows/workers-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Wrangler deploy dry-run
        run: npx wrangler deploy --dry-run
